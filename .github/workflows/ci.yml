# CI: test the app, build the image and smoke-test it; on main, publish the tested image to ghcr.io
# (ghcr.io/niranjankagri/pattern-shop-demo-app:latest and :sha-<7>), which the frameworks' CI jobs pull.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, without a code change: a new base image that breaks the build shows up within a week
    - cron: '0 23 * * 5'   # Friday 23:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: App tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Keep the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-app
          path: target/surefire-reports/
          retention-days: 30

  image:
    name: Image build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t pattern-shop:ci .
      - name: Start it and wait until healthy
        run: |
          docker run -d --name shop -p 8080:8080 pattern-shop:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' shop)" = healthy ] && exit 0
            sleep 2
          done
          docker logs shop; exit 1
      - name: Smoke test
        run: bash scripts/smoke.sh http://localhost:8080
      - name: Image size in the job summary
        if: ${{ !cancelled() }}
        run: |
          docker image inspect pattern-shop:ci --format 'Image size: {{.Size}} bytes' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the tested image (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sha="sha-${GITHUB_SHA::7}"
          docker tag pattern-shop:ci "$IMAGE:$sha"
          docker tag pattern-shop:ci "$IMAGE:latest"
          docker push "$IMAGE:$sha"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:$sha and :latest" >> "$GITHUB_STEP_SUMMARY"
    permissions:
      contents: read
      packages: write
