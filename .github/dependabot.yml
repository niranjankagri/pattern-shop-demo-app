# Keeps the Maven test libraries, CI actions and the Docker base images current. Once a month, minor and patch
# updates are grouped into one pull request per ecosystem; a major version comes as its own pull request and is
# reviewed before merging (a new Java major in the base image changes what every framework's CI runs).
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
